<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>
    <script src="script.js"></script>

    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">
    <button type="button" onclick="cekBilangan()">Periksa</button>
    <p id="hasilBilangan"></p>
    
    <button type="button" onclick="ubahWarnaLatar('lightgreen')">Latar Hijau</button>
    <button type="button" onclick="ubahWarnaLatar('white')">Latar Putih</button>
    <button type="button" onclick="ubahWarnaLatar('yellow')">Latar Kuning</button>

    <h3>Daftar Menu Makanan</h3>
    <label><input type="checkbox" class="menu" value="12000"> Ayam Goreng — Rp12.000</label><br>
    <label><input type="checkbox" class="menu" value="2000"> Tempe — Rp2000</label><br>
    <label><input type="checkbox" class="menu" value="7000"> Telur Dadar — Rp7.000</label><br>
    <button type="button" onclick="hitungTotal()">Total</button>
    <p>Total: Rp <span id="total">0</span></p>


    <hr>
    <h3>Kalkulator Nilai Mahasiswa</h3>
    <label>Tugas (30%) : <input type="number" id="tugas" value=" "></label><br>
    <label>UTS (30%) : <input type="number" id="uts" value=" "></label><br>
    <label>UAS (40%) : <input type="number" id="uas" value=" "></label><br>
    <button type="button" onclick="tampilkanNilai()">Hitung Nilai</button>

    <div id="hasilNilai" style="margin-top:10px; background:#eee; padding:none;">
        <p>Nilai Akhir : <b><span id="outAkhir">0</span></b></p>
        <p>Predikat : <b><span id="outPredikat">-</span></b></p>
        <p>Status : <b><span id="outStatus">-</span></b></p>
    </div>
</body>
</html>
